title: LSASS Credential Access Attempt
id: 70089876-f464-40e6-830c-01eb77f3ac86
status: experimental
description: >
  Detects attempts to access lsass.exe using dangerous process access rights.
  LSASS holds sensitive credentials including NTLM hashes and Kerberos TGTs,
  making it a primary target for credential dumping tools such as Mimikatz.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Johaan
date: 2026-08-18
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage: 'C:\Windows\System32\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x143a'
      - '0x40'
      - '0x1fffff'
  filter_defender:
    SourceImage|endswith: '\MsMpEng.exe'
  filter_taskmgr:
    SourceImage: 'C:\Windows\System32\taskmgr.exe'
  condition: selection and not (filter_defender or filter_taskmgr)
falsepositives:
  - AV/EDR agents other than Microsoft Defender (e.g. CrowdStrike, SentinelOne)
  - Legitimate use of Sysinternals ProcDump by administrators
level: high
